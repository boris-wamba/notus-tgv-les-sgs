[project]
name = "tgvtools"
version = "0.1.0"
description = "Post-processing tools for DNS/LES of the 3D Taylor-Green vortex (Notus runs)"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "matplotlib", "sympy"]

[project.optional-dependencies]
adios = ["adios"]
test = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
